<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title> Weather Forecast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Weather</h1>
      <div class="search">
        <input id="search" type="search" placeholder="Search a city, e.g. Cairo" autocomplete="off" aria-label="City name" />
        <button id="locate" type="button" title="Use my location" aria-label="Use my location">📍</button>
      </div>
    </header>

    <p id="status" class="status" role="status"></p>
    <h2 id="place" class="place"></h2>
    <section id="cards" class="cards" aria-live="polite"></section>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
